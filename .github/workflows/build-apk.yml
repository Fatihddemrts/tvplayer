name: APK derle

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # etiketli derlemede Release oluşturmak için

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle önbelleği: ikinci derlemeden itibaren bağımlılıklar yeniden inmez.
      - uses: gradle/actions/setup-gradle@v4

      # İmza anahtarı GitHub Secrets'tan gelir. Her derleme aynı anahtarla
      # imzalanmazsa TV'deki uygulamanın üzerine kurulamaz ("imza uyuşmuyor").
      # Secret yoksa derleme yine çalışır ama APK geçici anahtarla imzalanır.
      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret yok; APK geçici anahtarla imzalanacak."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Derle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: APK adını düzenle
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/MediaTANK-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: MediaTANK-apk
          path: out/*.apk
          retention-days: 30

      - name: Release oluştur (yalnız v* etiketlerinde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
